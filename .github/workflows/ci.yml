name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.16
      - run: ruff check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner light; the suite never needs a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40,<5" "numpy>=1.24" pytest

      - name: Run tests
        run: pytest -q
